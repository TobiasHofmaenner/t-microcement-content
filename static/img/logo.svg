<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" aria-label="T-Microcement">
  <!-- Stylised "T" mark: brand bar with wordmark slot at top,
       three vertical bars below (outer pair long, middle short).
       Approximated from the raster source — open to refinement
       if the operator can share the original artwork. -->
  <rect x="0"  y="0"   width="100" height="3"   fill="#1f1d1a"/>
  <rect x="32" y="6"   width="36"  height="6"   fill="#1f1d1a"/>
  <rect x="0"  y="15"  width="100" height="3"   fill="#1f1d1a"/>
  <rect x="38" y="20"  width="4"   height="100" fill="#1f1d1a"/>
  <rect x="48" y="20"  width="4"   height="42"  fill="#1f1d1a"/>
  <rect x="58" y="20"  width="4"   height="100" fill="#1f1d1a"/>
</svg>
